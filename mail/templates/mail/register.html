{% extends "mail/layout.html" %}

{% block body %}

<div class="auth-card">

<h3 class="text-center">

Register

</h3>

{% if message %}

<div class="alert alert-danger">

{{ message }}

</div>

{% endif %}

<form action="{% url 'register' %}"
method="post">

{% csrf_token %}

<div class="form-group">

<input
class="form-control"
type="email"
name="email"
placeholder="Email Address">

</div>


<div class="form-group">

<input
class="form-control"
type="password"
name="password"
placeholder="Password">

</div>


<div class="form-group">

<input
class="form-control"
type="password"
name="confirmation"
placeholder="Confirm Password">

</div>


<input
class="btn btn-primary btn-block"
type="submit"
value="Register">

</form>


<p class="text-center mt-3">

Already have an account?

<a href="{% url 'login' %}">
Log In here.
</a>

</p>

</div>

{% endblock %}
