{% extends "mail/layout.html" %}
{% load static %}

{% block body %}

<h4 class="mb-3 text-break">

{{ request.user.email }}

</h4>


<div class="mb-3">

<button class="btn btn-sm btn-outline-primary"
id="inbox">

Inbox

</button>


<button class="btn btn-sm btn-outline-primary"
id="compose">

Compose

</button>


<button class="btn btn-sm btn-outline-primary"
id="sent">

Sent

</button>


<button class="btn btn-sm btn-outline-primary"
id="archived">

Archived

</button>


<a class="btn btn-sm btn-outline-danger"
href="{% url 'logout' %}">

Log Out

</a>

</div>

<hr>


<div id="emails-view">

</div>



<div id="compose-view">

<h4>New Email</h4>


<div id="compose-result"
class="alert alert-danger"
role="alert"
style="display:none">

</div>



<form id="compose-form">

<div class="form-group">

From:

<input disabled
class="form-control"
value="{{ request.user.email }}">

</div>



<div class="form-group">

To:

<input id="compose-recipients"
class="form-control">

</div>



<div class="form-group">

<input
class="form-control"
id="compose-subject"
placeholder="Subject">

</div>



<textarea
class="form-control"
id="compose-body"
placeholder="Body">

</textarea>

<br>

<input type="submit"
value="Send mail"
class="btn btn-primary btn-block">

</form>

</div>

{% endblock %}


{% block script %}

<script src="{% static 'mail/inbox.js' %}"></script>

{% endblock %}
