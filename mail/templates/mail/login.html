{% extends "mail/layout.html" %}

{% block body %}

<div class="auth-card">

<h3 class="text-center">

Login

</h3>

{% if message %}

<div class="alert alert-danger">

{{ message }}

</div>

{% endif %}

<form action="{% url 'login' %}"
method="post">

{% csrf_token %}

<div class="form-group">

<input autofocus
class="form-control"
type="email"
name="email"
placeholder="Email">

</div>


<div class="form-group">

<input
class="form-control"
type="password"
name="password"
placeholder="Password">

</div>

<input
class="btn btn-primary btn-block"
type="submit"
value="Login">

</form>

<p class="text-center mt-3">

Don't have an account?

<a href="{% url 'register' %}">
Register here.
</a>

</p>

</div>

{% endblock %}
